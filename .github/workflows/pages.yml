name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - fixed-camera-experiment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: Checkout fixed-camera experiment
        uses: actions/checkout@v4
        with:
          ref: fixed-camera-experiment
          path: _fixed-camera

      - name: Add experiment under fixed-camera path
        shell: bash
        run: |
          rm -rf _site/fixed-camera
          mkdir -p _site/fixed-camera
          cp -a _fixed-camera/. _site/fixed-camera/
          rm -rf _site/fixed-camera/.git
          rm -rf _site/fixed-camera/.github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
