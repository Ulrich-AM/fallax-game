<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bossfights - Movement Foundation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Bossfights</h1>
        <p>movement, stamina and procedural shape foundation</p>
      </div>
      <div class="controls" aria-label="Controls">
        <span><b>A / D</b> move</span>
        <span><b>Space</b> jump</span>
        <span><b>Shift</b> sprint</span>
        <span><b>Ctrl</b> dash</span>
        <span><b>R</b> reset</span>
        <span><b>Click test shape</b> rotate</span>
      </div>
    </header>
    <section class="stage-wrap">
      <canvas id="game" width="1280" height="720" aria-label="Bossfights movement test"></canvas>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
