<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fallax - boss rush</title>
  <link rel="stylesheet" href="style.css?v=33" />
</head>
<body>
  <div id="app">
    <section id="menu-screen" class="screen">
      <div class="menu-card">
        <h1>fallax</h1>
        <div class="menu-subtitle">boss rush</div>
        <button id="main-button" class="menu-button">main</button>
        <button id="equipment-button" class="menu-button">equipment</button>
        <button id="shop-button" class="menu-button">shop</button>
      </div>
    </section>

    <section id="chapter-screen" class="screen hidden">
      <div class="chapter-shell">
        <div class="chapter-topbar">
          <button id="chapter-back" class="back-button">← main menu</button>
          <div id="chapter-tabs" class="chapter-tabs" aria-label="Chapters"></div>
        </div>

        <div class="chapter-space"></div>

        <div class="boss-strip">
          <div id="boss-list" class="boss-list"></div>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen hidden">
      <div class="game-frame">
        <canvas id="game" width="1280" height="720" aria-label="Bossfights game"></canvas>
        <div class="game-hint">Esc: menu</div>

        <div class="weapon-switcher" aria-label="Weapon slots">
          <button id="weapon-slot-1" class="weapon-slot-button"></button>
          <button id="weapon-slot-2" class="weapon-slot-button"></button>
        </div>

        <div id="death-menu" class="death-menu hidden">
          <div class="death-card">
            <h2 id="encounter-result-title">defeated</h2>
            <button id="death-restart" class="menu-button">restart</button>
            <button id="death-menu-button" class="menu-button">menu</button>
            <button id="death-inventory" class="menu-button">inventory</button>
          </div>
        </div>
      </div>
    </section>


    <section id="shop-screen" class="screen hidden">
      <aside class="equipment-sidebar">
        <button id="shop-back" class="back-button">← main menu</button>
        <h2>shop</h2>
      </aside>

      <main class="equipment-main">
        <section class="equipment-panel">
          <div class="section-heading">
            <h3>shop</h3>
            <span>everything is free for now</span>
          </div>
          <div id="shop-items" class="inventory-grid"></div>
        </section>
      </main>
    </section>

    <section id="equipment-screen" class="screen hidden">
      <aside class="equipment-sidebar">
        <button id="equipment-back" class="back-button">← main menu</button>
        <h2>equipment</h2>
        <nav id="equipment-tabs" class="equipment-tabs" aria-label="Equipment categories"></nav>
      </aside>

      <main class="equipment-main">
        <section class="equipment-panel">
          <div class="section-heading">
            <h3 id="equipment-category-title">weapons</h3>
            <span id="equipment-slot-summary"></span>
          </div>
          <div id="equipment-slots" class="equipment-slots"></div>
        </section>

        <section id="inventory-drop-zone" class="equipment-panel inventory-panel">
          <div class="section-heading">
            <h3>inventory</h3>
            <span>drag items between inventory and slots</span>
          </div>
          <div id="equipment-inventory" class="inventory-grid"></div>
        </section>
      </main>
    </section>
  </div>

  <script type="module" src="src/main.js?v=33"></script>
</body>
</html>
